name: site

on:
  schedule:
    # Hourly is plenty: Google crawls ~daily, deals last hours-to-days, and
    # extension users get real-time data from their own browser's polling.
    # During major sale weeks (Summer finale, Black Friday) drop this to
    # "*/20 * * * *" — flash rotations are 3-hourly at their fastest.
    - cron: "11 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deals data
        run: node site/generate.mjs
        env:
          SITE_BASE_URL: https://jeffreylynch.github.io/asset-sale-watch
      - name: Commit new weekly drafts only
        run: |
          git config user.name "asset-sale-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/drafts
          git diff --staged --quiet || { git commit -m "chore(site): weekly digest draft [skip ci]"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
