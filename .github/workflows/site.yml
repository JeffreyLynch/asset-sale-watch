name: site

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate deals data
        run: node site/generate.mjs
        env:
          SITE_BASE_URL: https://jeffreylynch.github.io/asset-sale-watch
      - name: Commit refreshed data
        run: |
          git config user.name "asset-sale-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data site/deals.html site/sitemap.xml site/drafts
          git diff --staged --quiet || { git commit -m "chore(site): refresh deals data [skip ci]"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
